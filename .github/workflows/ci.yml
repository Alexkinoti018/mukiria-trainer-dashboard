name: CI & RBAC Security Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rbac-security-and-build:
    name: RBAC Security Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript Typecheck (tsc --noEmit)
        run: npm run check

      - name: Build Production Client & Server Bundles
        run: npm run build

      - name: Run RBAC & Authorization Security Tests (Vitest)
        run: npm test

      - name: Reject generated backups or data changes
        if: always()
        run: |
          failed=0

          for path in backup reports; do
            if [ -e "$path" ]; then
              echo "::error::$path must not be generated in the repository"
              failed=1
            fi
          done

          if ! git diff --quiet -- server/data database/seeds; then
            echo "::error::Tests or scripts modified repository data"
            git status --short -- server/data database/seeds
            failed=1
          fi

          generated_data="$(git ls-files --others --ignored --exclude-standard -- server/data database/seeds)"
          if [ -n "$generated_data" ]; then
            echo "::error::Tests or scripts created untracked data in the repository"
            printf '%s\n' "$generated_data"
            failed=1
          fi

          exit "$failed"
