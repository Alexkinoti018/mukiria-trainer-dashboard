name: CI & RBAC Security Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rbac-security-and-build:
    name: RBAC Security Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript Typecheck (tsc --noEmit)
        run: npm run check

      - name: Run RBAC & Authorization Security Tests (Vitest)
        run: npm test

      - name: Build Production Client & Server Bundles
        run: npm run build
